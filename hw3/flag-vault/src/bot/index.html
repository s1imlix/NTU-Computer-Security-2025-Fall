<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Service</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
    <header>
        <h1>Bot Service</h1>
        <p>Submit a URL for the bot to visit</p>
        <p>Note that you should target <b>http://web:11202</b> in your XSS payloads.</p>
    </header>

    <main>
        <form id="visitForm">
            <label for="url">URL:</label>
            <input type="url" id="url" name="url" required>
            <div class="cf-turnstile" data-sitekey="{{TURNSTILE_SITE_KEY}}"></div>
            <button type="submit">Visit URL</button>
        </form>

        <div id="result"></div>
    </main>

    <script>
        function createMessage(text, color) {
            const p = document.createElement('p');
            p.textContent = text;
            p.style.color = color;
            return p;
        }

        function showResult(resultDiv, text, isSuccess) {
            resultDiv.textContent = '';
            const message = createMessage(text, isSuccess ? 'green' : 'red');
            resultDiv.appendChild(message);
        }

        document.getElementById('visitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');

            showResult(resultDiv, 'Processing...', true);

            try {
                const response = await fetch('/visit', {
                    method: 'POST',
                    body: new URLSearchParams(new FormData(e.target)),
                });

                const data = await response.json();
                if (data.success) {
                    showResult(resultDiv, '✓ URL visited successfully!', true);
                } else {
                    showResult(resultDiv, `✗ Error: ${data.error}`, false);
                }
            } catch (error) {
                showResult(resultDiv, `✗ Error: ${error.message}`, false);
            }
        });
    </script>
</body>

</html>
